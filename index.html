<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好き顔2択メーカー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px 10px;
    }
    h1 { font-size: 20px; margin-bottom: 5px; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; }
    
    .versus-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      max-width: 400px;
      margin: 0 auto 20px;
    }
    .choice-card {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      background: #eee;
      transition: transform 0.1s;
    }
    .choice-card:active {
      transform: scale(0.95);
    }
    .choice-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vs {
      font-size: 20px;
      font-weight: bold;
      color: #ff69b4;
    }

    .progress-bar {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      margin: 0 auto 30px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ff69b4;
      transition: width 0.3s;
    }

    .result-container {
      display: none;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      width: 300px;
      height: 300px;
      margin: 20px auto;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .result-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="gameArea">
    <h1>どっちが好み？</h1>
    <p>直感で好きな方の写真をタップしてください！</p>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="versus-container">
      <div class="choice-card" onclick="selectWinner(0)">
        <img id="img0" src="" alt="Left">
      </div>
      <div class="vs">VS</div>
      <div class="choice-card" onclick="selectWinner(1)">
        <img id="img1" src="" alt="Right">
      </div>
    </div>
  </div>

  <div class="result-container" id="resultArea">
    <h2>✨ あなたの好き顔9選 ✨</h2>
    <div class="result-grid" id="resultGrid"></div>
    <p style="margin-top: 15px;">スクリーンショットして保存してね！</p>
  </div>

  <script>
    let images = [];
    let scores = {};
    let matchPairs = [];
    let currentMatch = 0;

    async function initGame() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const user = window.location.hostname.split('.')[0];
      const repo = pathParts[0] || '';

      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents`);
        const files = await res.json();
        
        if (Array.isArray(files)) {
          images = files
            .filter(f => f.type === 'file' && f.name.match(/\.(jpg|jpeg|png|webp|gif|JPG|PNG|JPEG)$/i))
            .map(f => f.name);
        }
      } catch (e) {
        console.error(e);
      }

      if (images.length < 2) {
        alert("画像が足りません。");
        return;
      }

      // スコア初期化
      images.forEach(img => scores[img] = 0);

      // 対戦ペアをランダムに作成（約15〜20回対戦）
      generateMatches();
      showMatch();
    }

    function generateMatches() {
      // 簡易的な総当たり/ランダムマッチング
      for (let i = 0; i < images.length; i++) {
        for (let j = i + 1; j < images.length; j++) {
          matchPairs.push([images[i], images[j]]);
        }
      }
      // ペアをシャッフル
      matchPairs.sort(() => Math.random() - 0.5);
      // 対戦数が多すぎないように調整（最大20戦）
      if (matchPairs.length > 20) {
        matchPairs = matchPairs.slice(0, 20);
      }
    }

    function showMatch() {
      if (currentMatch >= matchPairs.length) {
        finishGame();
        return;
      }

      const pair = matchPairs[currentMatch];
      document.getElementById('img0').src = pair[0];
      document.getElementById('img1').src = pair[1];

      // プログレスバー更新
      const percent = (currentMatch / matchPairs.length) * 100;
      document.getElementById('progress').style.width = percent + '%';
    }

    function selectWinner(index) {
      const pair = matchPairs[currentMatch];
      const winner = pair[index];
      scores[winner] += 1;

      currentMatch++;
      showMatch();
    }

    function finishGame() {
      document.getElementById('gameArea').style.display = 'none';

      // スコアが高い順にソートして上位9枚を取得
      const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const top9 = sorted.slice(0, 9);

      const resultGrid = document.getElementById('resultGrid');
      resultGrid.innerHTML = '';

      top9.forEach(imgSrc => {
        const img = document.createElement('img');
        img.src = imgSrc;
        resultGrid.appendChild(img);
      });

      document.getElementById('resultArea').style.display = 'block';
    }

    initGame();
  </script>

</body>
</html>
