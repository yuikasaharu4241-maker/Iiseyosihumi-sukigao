<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の好き顔9選</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 20px 10px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 5px;
      color: #333;
    }
    p {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
    }

    /* スタート画面 */
    .start-container {
      max-width: 360px;
      margin: 40px auto;
      background: #fff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* 2択対決画面 */
    .versus-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto 15px;
    }
    .choice-card {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
      cursor: pointer;
      background: #fff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .choice-card:active {
      transform: scale(0.95);
    }
    .choice-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vs {
      font-size: 22px;
      font-weight: 800;
      color: #ff4757;
      font-style: italic;
    }

    /* プログレスバー */
    .progress-bar {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin: 0 auto 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      transition: width 0.3s;
    }

    /* ボタン共通 */
    .btn {
      background: #fff;
      color: #666;
      border: 1px solid #ccc;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 15px;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* 結果画面 */
    .result-container {
      display: none;
      max-width: 380px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .result-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .result-title span {
      color: #8a2be2;
      border-bottom: 3px solid #8a2be2;
    }

    /* 3x3 グリッドレイアウト */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .result-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      background: #eee;
    }
    .result-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* 順位バッジ */
    .rank-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 10px;
      backdrop-filter: blur(2px);
    }
    .rank-1 { background: #ff4757; }
    .rank-2 { background: #2ed573; }
    .rank-3 { background: #1e90ff; }

    /* ピンク色のアクションボタン */
    .main-btn {
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 117, 140, 0.3);
      transition: transform 0.1s;
    }
    .main-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- 1. スタート画面 -->
  <div class="start-container" id="startArea">
    <h1>私の好き顔9選</h1>
    <p>2択の対決から直感で選んで、<br>あなたの推し顔TOP9を決定しよう！</p>
    <button class="main-btn" onclick="startNewGame()">🎮 スタート</button>
  </div>

  <!-- 2. 対決エリア -->
  <div id="gameArea" style="display: none;">
    <h1>直感で好きな方を選択！</h1>
    <p>どちらの顔が好みですか？（タップして選択）</p>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <!-- 1つ前に戻るボタン -->
    <button class="btn" id="backBtn" onclick="undoSelect()" disabled>↩️ ひとつ戻る</button>

    <div class="versus-container">
      <div class="choice-card" onclick="selectWinner(0)">
        <img id="img0" src="" alt="Left">
      </div>
      <div class="vs">VS</div>
      <div class="choice-card" onclick="selectWinner(1)">
        <img id="img1" src="" alt="Right">
      </div>
    </div>
  </div>

  <!-- 3. 結果表示エリア -->
  <div class="result-container" id="resultArea">
    <div class="result-title">私の<span>好き顔9選</span></div>
    <div class="result-grid" id="resultGrid"></div>
    <p style="margin-top: 15px; font-size: 12px; color: #888;">スクリーンショットして保存してください✨</p>

    <!-- もう一度遊ぶボタン -->
    <button class="main-btn" style="margin-top: 15px;" onclick="retryGame()">🔄 もう一度挑戦する</button>
  </div>

  <script>
    let images = [];
    let scores = {};
    let matchPairs = [];
    let currentMatch = 0;
    let history = []; // 選択履歴

    async function initGame() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const user = window.location.hostname.split('.')[0];
      const repo = pathParts[0] || '';

      try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents`);
        const files = await res.json();
        
        if (Array.isArray(files)) {
          images = files
            .filter(f => f.type === 'file' && f.name.match(/\.(jpg|jpeg|png|webp|gif|JPG|PNG|JPEG)$/i))
            .map(f => f.name);
        }
      } catch (e) {
        console.error(e);
      }

      if (images.length < 2) {
        alert("画像が読み込めませんでした。画像ファイルが正しく入っているか確認してください。");
      }
    }

    function startNewGame() {
      if (images.length < 2) {
        alert("画像が足りません。");
        return;
      }

      scores = {};
      matchPairs = [];
      currentMatch = 0;
      history = [];

      images.forEach(img => scores[img] = 0);
      generateMatches();

      document.getElementById('startArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';

      showMatch();
    }

    function generateMatches() {
      for (let i = 0; i < images.length; i++) {
        for (let j = i + 1; j < images.length; j++) {
          matchPairs.push([images[i], images[j]]);
        }
      }
      matchPairs.sort(() => Math.random() - 0.5);
      if (matchPairs.length > 20) {
        matchPairs = matchPairs.slice(0, 20);
      }
    }

    function showMatch() {
      if (currentMatch >= matchPairs.length) {
        finishGame();
        return;
      }

      const pair = matchPairs[currentMatch];
      document.getElementById('img0').src = pair[0];
      document.getElementById('img1').src = pair[1];

      const percent = (currentMatch / matchPairs.length) * 100;
      document.getElementById('progress').style.width = percent + '%';

      document.getElementById('backBtn').disabled = currentMatch === 0;
    }

    function selectWinner(index) {
      const pair = matchPairs[currentMatch];
      const winner = pair[index];
      
      history.push(winner);
      scores[winner] += 1;

      currentMatch++;
      showMatch();
    }

    function undoSelect() {
      if (currentMatch === 0 || history.length === 0) return;

      const lastWinner = history.pop();
      scores[lastWinner] -= 1;

      currentMatch--;
      showMatch();
    }

    function finishGame() {
      document.getElementById('gameArea').style.display = 'none';

      const sorted = Object.keys(scores).sort((a, b) => {
        return (scores[b] + Math.random() * 0.1) - (scores[a] + Math.random() * 0.1);
      });

      const top9 = sorted.slice(0, 9);
      
      // 中央1位（4,5,6 / 2,1,3 / 7,8,9）の配置
      const displayOrder = [
        { item: top9[3], rank: 4 },
        { item: top9[4], rank: 5 },
        { item: top9[5], rank: 6 },
        { item: top9[1], rank: 2 },
        { item: top9[0], rank: 1 },
        { item: top9[2], rank: 3 },
        { item: top9[6], rank: 7 },
        { item: top9[7], rank: 8 },
        { item: top9[8], rank: 9 }
      ];

      const resultGrid = document.getElementById('resultGrid');
      resultGrid.innerHTML = '';

      displayOrder.forEach(({ item, rank }) => {
        if (!item) return;

        const card = document.createElement('div');
        card.className = 'result-card';

        const img = document.createElement('img');
        img.src = item;

        const badge = document.createElement('div');
        badge.className = `rank-badge ${rank <= 3 ? 'rank-' + rank : ''}`;
        badge.textContent = `${rank}位`;

        card.appendChild(img);
        card.appendChild(badge);
        resultGrid.appendChild(card);
      });

      document.getElementById('resultArea').style.display = 'block';
    }

    function retryGame() {
      startNewGame();
    }

    initGame();
  </script>

</body>
</html>
